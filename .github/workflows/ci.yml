name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin the image: `ubuntu-latest` started rolling to Ubuntu 26 on 2026-10-19,
    # and Playwright's `--with-deps` apt step stalls on the newer image.
    runs-on: ubuntu-24.04
    # Playwright's `--with-deps` occasionally stalls on apt; the job itself
    # normally finishes in ~5 min, so allow headroom for a slow install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Elixir deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Elixir dependencies
        working-directory: backend
        run: mix deps.get

      - name: Lint Elixir (format + credo)
        run: pnpm lint:backend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Harden apt (no prompts, bounded lock, retries)
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'DPkg::Lock::Timeout "120";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

      - name: Install Playwright (chromium)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt has a habit of stalling on this runner. Bound each attempt so a
          # hiccup fails fast and retries instead of hanging until the job-level
          # 20-minute timeout cancels the whole run.
          for attempt in 1 2; do
            if timeout 300 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt ${attempt} failed; retrying"
            timeout 60 sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1

      - name: Lint, unit tests, build
        run: pnpm check

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose